name: Run iTop → Power BI Pipeline

# Deux déclencheurs :
#
# 1. workflow_dispatch — déclenché à distance, typiquement par Power Automate
#    via l'API REST GitHub :
#      POST /repos/{owner}/{repo}/actions/workflows/run-pipeline.yml/dispatches
#      avec un body { "ref": "main", "inputs": { ... } }.
#
# 2. schedule — cron toutes les 2 heures (heure UTC). Un run planifié n'a pas
#    d'"inputs" (propres à workflow_dispatch) : il retombe sur les mêmes
#    valeurs par défaut que le déclenchement manuel (skip_ai=false, donc IA +
#    Monétique actifs si AI_ENRICHMENT_ENABLED / MONETIQUE_AI_ENABLED = True
#    côté secrets — voir plus bas).
#
# Mode fixe : sharepoint → sharepoint (téléchargement du fichier source
# SharePoint, ETL, dépôt du classeur final dans SharePoint). Les autres
# options CLI exposées ci-dessous sont mappées sur les inputs.
on:
  workflow_dispatch:
    inputs:
      skip_ai:
        description: "Ignorer l'enrichissement IA (UC1 + Monétique) pour ce run"
        type: boolean
        required: false
        default: false
      full_refresh:
        description: "Ignorer last_run.json (mode API uniquement — sans effet ici, mode sharepoint→sharepoint)"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Génère le classeur localement sans le déposer sur SharePoint (pour tester le déclenchement)"
        type: boolean
        required: false
        default: false
  schedule:
    # Toutes les 2 heures, à l'heure pile (UTC).
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  # Evite deux exécutions concurrentes qui déposeraient le même fichier
  # SharePoint en même temps.
  group: itop-powerbi-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (sharepoint → sharepoint)
        env:
          # ── SharePoint (Graph API) — auth + emplacement source/destination ──
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER_PATH: ${{ secrets.SHAREPOINT_FOLDER_PATH }}
          SHAREPOINT_SOURCE_FILE_NAME: ${{ secrets.SHAREPOINT_SOURCE_FILE_NAME }}
          # Optionnel — nom de la liste SharePoint de retour de statut
          # (En cours / OK / Erreur). Laisser le secret vide pour désactiver.
          SHAREPOINT_STATUS_LIST_NAME: ${{ secrets.SHAREPOINT_STATUS_LIST_NAME }}

          # ── Sécurité / PII ──────────────────────────────────────────────────
          PII_SALT: ${{ secrets.PII_SALT }}
          INCLUDE_AGENT_NAME: ${{ secrets.INCLUDE_AGENT_NAME }}

          # ── Export ────────────────────────────────────────────────────────
          MODEL_EXPORT_FILE: ${{ secrets.MODEL_EXPORT_FILE }}
          EXPORT_FILE: ${{ secrets.EXPORT_FILE }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

          # ── Enrichissement IA (Groq) — optionnel, ignoré si skip_ai=true ────
          AI_ENRICHMENT_ENABLED: ${{ secrets.AI_ENRICHMENT_ENABLED }}
          MONETIQUE_AI_ENABLED: ${{ secrets.MONETIQUE_AI_ENABLED }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_MODEL_SUMMARY: ${{ secrets.GROQ_MODEL_SUMMARY }}
        run: |
          # Sur un run "schedule", il n'y a pas de contexte "inputs" (propre à
          # workflow_dispatch) : on retombe explicitement sur les mêmes
          # défauts que le déclenchement manuel, plutôt que de dépendre d'une
          # évaluation vide silencieuse de ${{ inputs.* }}.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP_AI="false"
            FULL_REFRESH="false"
            DRY_RUN="false"
          else
            SKIP_AI="${{ inputs.skip_ai }}"
            FULL_REFRESH="${{ inputs.full_refresh }}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi

          ARGS="--input sharepoint --output sharepoint"

          if [ "$SKIP_AI" = "true" ]; then
            ARGS="$ARGS --skip-ai"
          fi
          if [ "$FULL_REFRESH" = "true" ]; then
            ARGS="$ARGS --full-refresh"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Déclencheur : ${{ github.event_name }}"
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

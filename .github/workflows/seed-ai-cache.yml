name: Seed AI classification cache (one-off)

# Outil ponctuel : dépose un cache/ai_classifications.json committé (voir le
# commit qui l'accompagne) directement dans le cache GitHub Actions, sans
# toucher à SharePoint/Groq/rien d'autre du pipeline réel.
#
# Contexte : le cache IA (cache/ai_classifications.json) est dans .gitignore,
# donc chaque run CI repart normalement de zéro et doit reclassifier tous les
# tickets via Groq (lent, rate-limited). Ce workflow permet d'injecter en une
# fois un cache déjà construit en local (des dizaines/centaines de runs
# locaux) pour donner un vrai point de départ au cache CI, au lieu d'attendre
# sa reconstruction progressive sur plusieurs jours.
#
# A supprimer (ce fichier + le commit du cache) une fois le seed effectué.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify seed file is present
        run: |
          test -f cache/ai_classifications.json || (echo "cache/ai_classifications.json absent du checkout — rien à seeder." && exit 1)
          python3 -c "import json; d=json.load(open('cache/ai_classifications.json', encoding='utf-8')); print(f'{len(d)} entrées à seeder')"

      - name: Seed AI classification cache
        uses: actions/cache/save@v4
        with:
          path: cache/ai_classifications.json
          key: ai-classifications-${{ github.run_id }}
